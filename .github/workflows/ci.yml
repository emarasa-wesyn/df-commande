name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm test
      - run: >
          node --disable-warning=ExperimentalWarning --test --experimental-test-coverage
          --test-coverage-include='src/devis/**'
          --test-coverage-lines=80 --test-coverage-branches=80

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          V=8.30.1
          URL=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSfL "$URL/v$V/gitleaks_${V}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      - run: gitleaks git -v --no-banner --redact --log-opts="HEAD" .

  revue-ia:
    if: github.event_name == 'pull_request'
    needs: [qualite, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
    steps:
      - id: jeton
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::notice::revue IA sautée : secret COPILOT_PAT absent"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.jeton.outputs.present == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: steps.jeton.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: steps.jeton.outputs.present == 'true'
        run: npm install -g @github/copilot
      - if: steps.jeton.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            cat .github/prompts/revue-pr.txt
            printf '\n\n--- Diff de la pull request ---\n'
            git diff "origin/$BASE_REF...HEAD"
          } > "$RUNNER_TEMP/revue-prompt.txt"
      - id: revue
        if: steps.jeton.outputs.present == 'true'
        uses: actions/ai-inference@v3
        with:
          prompt-file: ${{ runner.temp }}/revue-prompt.txt
          model: ''
      - if: steps.jeton.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPONSE: ${{ steps.revue.outputs.response-file }}
        run: gh pr comment "$PR_NUMBER" --body-file "$REPONSE"
